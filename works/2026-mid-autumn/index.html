<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">


<title>
Moonlight Letter · 月满中秋
</title>


<style>


/* ==========================
   基础
========================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

}


html,
body{

width:100%;
height:100%;

overflow:hidden;

font-family:
"PingFang SC",
"Microsoft YaHei",
serif;

background:#050b18;

}



/* ==========================
   夜空背景
========================== */


#scene{

position:fixed;

inset:0;

overflow:hidden;


background:

radial-gradient(
circle at 25% 20%,
rgba(80,100,170,.35),
transparent 30%
),


linear-gradient(
180deg,
#09142f 0%,
#081226 45%,
#050914 100%
);


}



/* ==========================
   星空
========================== */


.star{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

opacity:.7;


animation:

twinkle 3s infinite alternate;

}



@keyframes twinkle{


from{

opacity:.2;

transform:scale(.7);

}


to{

opacity:1;

transform:scale(1.5);

}


}



/* ==========================
   开场遮罩
========================== */


#cover{

position:absolute;

inset:0;

z-index:100;

pointer-events:none;


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


background:

radial-gradient(
circle,
#283761,
#070b19 70%
);


color:#ffe8ae;


transition:

opacity 1.2s ease;

}



.cover-moon{

font-size:80px;

margin-bottom:25px;


animation:

moonBreath 2s infinite alternate;

}



@keyframes moonBreath{


from{

transform:scale(.95);

}


to{

transform:scale(1.08);

}


}



#cover h1{

font-size:25px;

font-weight:normal;

letter-spacing:6px;

}



#cover p{

margin-top:20px;

font-size:13px;

letter-spacing:3px;

color:
rgba(255,255,255,.55);

}



/* ==========================
   月亮
========================== */


.moon{


position:absolute;


left:50%;

top:22%;


width:160px;

height:160px;


transform:

translate(-50%,-50%);


border-radius:50%;


background:

radial-gradient(
circle at 35% 30%,
#fffdf3,
#ffe7a0 55%,
#ffc968
);


box-shadow:


0 0 40px
rgba(255,225,140,.9),


0 0 120px
rgba(255,215,100,.5);


cursor:pointer;


transition:

all 2s ease;


z-index:5;


}



.moon.active{


left:22%;

top:18%;


width:145px;

height:145px;


}




.moon-glow{


position:absolute;


left:50%;

top:22%;


width:400px;

height:400px;


transform:

translate(-50%,-50%);


border-radius:50%;


background:

radial-gradient(
circle,
rgba(255,225,140,.25),
transparent 70%
);


transition:

all 2s ease;


}



.moon-glow.active{


left:22%;

top:18%;


}




/* ==========================
   月面纹理
========================== */
.moon::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        radial-gradient(circle at 28% 35%, rgba(190,150,80,.28) 0 9%, transparent 10%),
        radial-gradient(circle at 65% 28%, rgba(190,150,80,.18) 0 12%, transparent 13%),
        radial-gradient(circle at 55% 68%, rgba(190,150,80,.22) 0 8%, transparent 9%),
        radial-gradient(circle at 30% 75%, rgba(190,150,80,.15) 0 6%, transparent 7%);
    mix-blend-mode:multiply;
}

.moon::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, transparent 40%, rgba(255,180,80,.12));
}

/* ==========================
   云层
========================== */


.cloud{


position:absolute;


width:220px;

height:55px;


background:

rgba(255,255,255,.10);


border-radius:50px;


filter:blur(5px);


animation:

cloudMove 35s infinite ease-in-out;


}


.cloud:before,
.cloud:after{


content:"";

position:absolute;


background:

rgba(255,255,255,.10);


border-radius:50%;


}



.cloud:before{

width:80px;

height:80px;

left:35px;

top:-35px;

}



.cloud:after{

width:60px;

height:60px;

left:120px;

top:-20px;

}



.cloud1{

top:20%;

left:5%;

}



.cloud2{

top:30%;

left:55%;

animation-duration:45s;

}




@keyframes cloudMove{


50%{

transform:

translateX(80px);

}


}



/* ==========================
   流星
========================== */


.meteor{


position:absolute;


width:120px;

height:2px;


background:

linear-gradient(
90deg,
transparent,
white
);


transform:

rotate(-30deg);


opacity:0;


}



/* ==========================
   烟花 canvas
========================== */


#fireworks{


position:absolute;


inset:0;


z-index:3;


pointer-events:none;

}



/* ==========================
   孔明灯
========================== */


.lantern{


position:absolute;


bottom:-80px;


font-size:35px;


z-index:4;


opacity:.8;


}



/* ==========================
   草坡
========================== */


.grass{


position:absolute;


bottom:-15%;


left:50%;


transform:

translateX(-50%);


width:140%;


height:45%;


border-radius:

50% 50% 0 0;


background:


linear-gradient(
180deg,
#172235,
#050913
);



z-index:2;


}



/* ==========================
   坐在草地上的朋友剪影
========================== */


.people{

    bottom:13%;

    gap:12px;

}



.person{

    width:75px;

    height:90px;

    position:relative;

}



/* 头 */

.head{

    position:absolute;

    top:0;

    left:25px;

    width:30px;

    height:30px;

    border-radius:50%;

    background:#05070c;

}



/* 身体（坐姿） */

.body{

    position:absolute;

    top:28px;

    left:18px;

    width:45px;

    height:38px;

    border-radius:

    20px 20px 8px 8px;

    background:#05070c;

}



/* 坐着伸出的腿 */

.leg{

    position:absolute;

    bottom:10px;

    width:45px;

    height:8px;

    background:#05070c;

    border-radius:10px;

}



/* 左腿 */

.leg.left{

    left:5px;

    transform:

    rotate(8deg);

}


/* 右腿 */

.leg.right{

    right:0;

    transform:

    rotate(-8deg);

}

/* ==========================
   草地萤火虫
========================== */
.fireflies{
    position:absolute;
    bottom:20%;
    left:0;
    width:100%;
    height:120px;
    z-index:5;
    pointer-events:none;
}

.fireflies span{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ffeaa0;
    box-shadow:0 0 16px #ffeaa0;
    animation:fireflyFloat 4s infinite ease-in-out;
}

.fireflies span:nth-child(1){left:22%;top:50%;}
.fireflies span:nth-child(2){left:38%;top:25%;animation-delay:1s;}
.fireflies span:nth-child(3){left:58%;top:60%;animation-delay:2s;}
.fireflies span:nth-child(4){left:75%;top:35%;animation-delay:.5s;}
.fireflies span:nth-child(5){left:86%;top:65%;animation-delay:1.5s;}

@keyframes fireflyFloat{
    0%,100%{opacity:.25;transform:translateY(0);}
    50%{opacity:1;transform:translateY(-20px);}
}

/* ==========================
   祝福卡片
========================== */


.message{


position:absolute;


left:50%;


top:42%;


transform:

translate(-50%,-50%);


width:min(88vw,520px);


z-index:10;


text-align:center;


color:#fff4d5;


opacity:0;


transition:

opacity 1.5s ease;


}



.message.show{


opacity:1;


}




.title{


font-size:32px;


letter-spacing:8px;


color:#ffe4a0;


margin-bottom:20px;


}




.blessing-card{


position:relative;


padding:30px;


border-radius:28px;


background:

rgba(255,245,220,.08);


border:

1px solid
rgba(255,220,150,.3);



backdrop-filter:

blur(15px);



box-shadow:


0 0 40px
rgba(255,220,150,.15);


overflow:hidden;


}



.card-light{


position:absolute;


right:-50px;


top:-50px;


width:160px;


height:160px;


background:

radial-gradient(
circle,
rgba(255,230,160,.4),
transparent 70%
);



filter:blur(15px);


}



.style-name{


font-size:13px;


letter-spacing:3px;


color:#ffd98c;


margin-bottom:18px;


}



#blessing{


font-size:18px;


line-height:2;


letter-spacing:2px;


white-space:pre-line;


font-family:

"STKaiti",
"KaiTi",
serif;


}



.buttons{


margin-top:25px;


display:flex;


justify-content:center;


gap:12px;


}



button{


padding:10px 18px;


border-radius:30px;


border:

1px solid
rgba(255,220,150,.3);



background:

rgba(255,255,255,.08);



color:#ffe9b0;


cursor:pointer;


}




.footer{


position:absolute;


bottom:15px;


width:100%;


text-align:center;


font-size:11px;


letter-spacing:4px;


color:

rgba(255,255,255,.3);


}




</style>


</head>

<!-- 开场遮罩 -->

<div id="cover">

    <div class="cover-moon" id="coverMoon">

<div class="fireflies">
<span></span><span></span><span></span><span></span><span></span>

<div class="people">

</div>

</div>

</div>



</div>





<script>
/* =====================================
   组合式诗意祝福生成器
===================================== */


const blessingPool = {


opening:[

"今夜月色温柔，",

"一轮明月越过山河，",

"桂香随着晚风轻轻而来，",

"月上中天，星河微亮，",

"在这一场温柔的秋夜里，",

"当晚风吹过窗前，月光也带来了问候，",

"这一夜，明月与清风相伴，",

"在万家灯火之外，也有一轮月亮为你而明。"

],



scene:[

"清辉落在人间，也落在每一个认真生活的人身旁。",

"远方与此刻，都被同一轮月亮温柔照亮。",

"愿这一刻的宁静，替你收藏一路的疲惫。",

"风吹桂香，星河微亮，万物都在诉说温柔。",

"即使相隔山海，也共享这一片澄澈月光。",

"愿岁月缓缓流淌，把所有美好悄悄赠予你。",

"愿窗前的月色，带走忙碌后的疲惫，也留下心中的温暖。",

"愿你在平凡的日子里，也能遇见属于自己的小小浪漫。"

],



wish:[

"愿你心中有月，眼里有光，所行之路皆有方向。",

"愿你所念皆有回应，所行皆有收获。",

"愿每一次努力都有回响，每一个期待都有归期。",

"愿忙碌之外，也拥有属于自己的浪漫与安宁。",

"愿你一路奔赴热爱，也一路被温柔拥抱。",

"愿未来的每一天，都比今天多一点欢喜。",

"愿你拥有看见美好的眼睛，也拥有守护热爱的力量。",

"愿山高水长之后，依旧有人间值得。"

],



ending:[

"中秋快乐，愿岁岁常欢。",

"愿这一轮明月，替我送去最真挚的祝福。",

"愿未来的日子，如月光一般明亮。",

"愿山长水远，我们都拥有自己的星辰与月光。",

"愿此后每一天，都有值得期待的事情。",

"愿你平安喜乐，万事顺遂。"

]

};





/* 研究生隐藏彩蛋 */


const graduateBlessing = [

"今夜暂放下未完成的思考，\n"+
"抬头看看这一轮明月。\n\n"+
"愿你的探索都有答案，\n"+
"努力都有回响。\n\n"+
"愿忙碌之外，也有属于自己的月光。",


"愿你在追逐目标的路上，\n"+
"始终保持清醒与热爱。\n\n"+
"愿每一次尝试都有收获，\n"+
"每一份坚持都有意义。",


"愿你在繁忙的日程之外，\n"+
"仍然拥有仰望星空的时间。\n\n"+
"愿前路明亮，所愿皆成。"

];





function random(arr){

return arr[
Math.floor(Math.random()*arr.length)
];

}





function generateBlessing(){


/*

10%概率研究生彩蛋

*/


if(Math.random()<0.1){


return {

style:"月光彩蛋",

text:
random(graduateBlessing)

};


}



return {


style:"月光寄语",


text:

random(blessingPool.opening)

+

"\n"

+

random(blessingPool.scene)

+

"\n\n"

+

random(blessingPool.wish)

+

"\n"

+

random(blessingPool.ending)


};


}






function showBlessing(){


let result=generateBlessing();


document.getElementById(
"styleName"
).innerText=result.style;



document.getElementById(
"blessing"
).innerText=result.text;



}



function newBlessing(){


showBlessing();


smallFirework();


}
/* =====================================
   点击月亮
===================================== */


const moon =
document.getElementById("moon");


const coverMoon =
document.getElementById("coverMoon");


const moonGlow =
document.getElementById("moonGlow");


const cover =
document.getElementById("cover");


const message =
document.getElementById("message");



let started=false;



function startMoon(){


if(started)
return;


started=true;



moon.classList.add("active");


moonGlow.classList.add("active");



cover.style.opacity=0;



setTimeout(()=>{

cover.style.display="none";


},1200);





setTimeout(()=>{


message.classList.add("show");


showBlessing();


startFireworks();


startLantern();


startMeteor();



},1800);



};




/* =====================================
   重新点亮
===================================== */


function relightMoon(){


moon.classList.remove("active");

moonGlow.classList.remove("active");


void moon.offsetWidth;


setTimeout(()=>{


moon.classList.add("active");

moonGlow.classList.add("active");


showBlessing();


bigFirework();



},100);


}
/* =====================================
   星空生成
===================================== */

const scene =
document.getElementById("scene");


for(let i=0;i<90;i++){


    const star=
    document.createElement("div");


    star.className="star";


    star.style.left=
    Math.random()*100+"%";


    star.style.top=
    Math.random()*75+"%";


    const size=
    Math.random()*2+1;


    star.style.width=
    size+"px";


    star.style.height=
    size+"px";


    star.style.animationDuration=
    (2+Math.random()*3)+"s";


    star.style.animationDelay=
    Math.random()*2+"s";


    scene.appendChild(star);


}




/* =====================================
   烟花 canvas
===================================== */

const canvas =
document.getElementById("fireworks");


const ctx =
canvas.getContext("2d");


let particles=[];



function resizeCanvas(){


    const ratio=
    window.devicePixelRatio||1;


    canvas.width=
    window.innerWidth*ratio;


    canvas.height=
    window.innerHeight*ratio;


    canvas.style.width=
    window.innerWidth+"px";


    canvas.style.height=
    window.innerHeight+"px";


    ctx.setTransform(
    ratio,0,0,ratio,0,0
    );


}


resizeCanvas();


window.addEventListener(
"resize",
resizeCanvas
);




class Particle{


    constructor(x,y,color){


        this.x=x;
        this.y=y;


        const angle=
        Math.random()*Math.PI*2;


        const speed=
        Math.random()*4+1;


        this.vx=
        Math.cos(angle)*speed;


        this.vy=
        Math.sin(angle)*speed;


        this.alpha=1;


        this.color=color;


        this.size=
        Math.random()*2+1;


    }



    update(){


        this.x+=this.vx;
        this.y+=this.vy;


        this.vy+=0.025;


        this.vx*=0.985;


        this.alpha-=0.012;


    }



    draw(){


        ctx.globalAlpha=
        this.alpha;


        ctx.beginPath();


        ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI*2
        );


        ctx.fillStyle=
        this.color;


        ctx.fill();


    }


}




function explode(x,y,amount=75){


    const colors=[

    "#ffe7a7",
    "#ffd26d",
    "#ffb5ca",
    "#ffffff",
    "#ffc879",
    "#ffd9ef"

    ];


    const color=
    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];


    for(let i=0;i<amount;i++){


        particles.push(
        new Particle(x,y,color)
        );


    }


}




function animate(){


    ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
    );


    particles=
    particles.filter(
    p=>p.alpha>0
    );


    particles.forEach(p=>{


        p.update();
        p.draw();


    });


    ctx.globalAlpha=1;


    requestAnimationFrame(animate);


}


animate();




function bigFirework(){


    explode(
    window.innerWidth*0.22,
    window.innerHeight*0.20,
    80
    );


    setTimeout(()=>{


        explode(
        window.innerWidth*0.68,
        window.innerHeight*0.18,
        80
        );


    },450);



    setTimeout(()=>{


        explode(
        window.innerWidth*0.48,
        window.innerHeight*0.12,
        95
        );


    },900);


}




function smallFirework(){


    explode(
    window.innerWidth*(0.20+Math.random()*0.55),
    window.innerHeight*(0.10+Math.random()*0.26),
    55
    );


}




let fireworkTimer=null;



function startFireworks(){


    bigFirework();


    fireworkTimer=
    setInterval(()=>{


        smallFirework();


        if(Math.random()<0.45){

            setTimeout(
            smallFirework,
            350
            );

        }


    },3200);


}




/* =====================================
   孔明灯
===================================== */

function createLantern(){


    const lantern=
    document.createElement("div");


    lantern.className="lantern";


    lantern.innerText="🏮";


    lantern.style.left=
    (10+Math.random()*80)+"%";


    lantern.style.animation=
    `lanternRise ${12+Math.random()*6}s linear forwards`;


    lantern.style.fontSize=
    (24+Math.random()*18)+"px";


    scene.appendChild(lantern);


    setTimeout(()=>{

        lantern.remove();

    },19000);


}




function startLantern(){


    const style=
    document.createElement("style");


    style.innerHTML=`

    @keyframes lanternRise{

        0%{
            transform:translateY(0);
            opacity:0;
        }

        10%{
            opacity:.85;
        }

        100%{
            transform:translateY(-120vh) translateX(20px);
            opacity:0;
        }

    }

    `;


    document.head.appendChild(style);


    createLantern();


    setInterval(()=>{

        createLantern();

    },2600);


}




/* =====================================
   流星
===================================== */

function createMeteor(){


    const meteor=
    document.createElement("div");


    meteor.className="meteor";


    meteor.style.left=
    (58+Math.random()*28)+"%";


    meteor.style.top=
    (8+Math.random()*18)+"%";


    meteor.style.opacity=1;


    scene.appendChild(meteor);


    meteor.animate([

        {
            transform:"translate(0,0) rotate(-30deg)",
            opacity:0
        },

        {
            transform:"translate(0,0) rotate(-30deg)",
            opacity:1,
            offset:0.15
        },

        {
            transform:"translate(-180px,110px) rotate(-30deg)",
            opacity:0
        }

    ],{
        duration:1300,
        easing:"ease-out"
    });


    setTimeout(()=>{

        meteor.remove();

    },1400);


}




function startMeteor(){


    setInterval(()=>{


        if(Math.random()<0.65){

            createMeteor();

        }


    },4800);


}




/* =====================================
   点击空白处放小烟花
===================================== */

document.addEventListener(
"click",
function(event){


    if(!started)
    return;


    if(
    event.target.tagName==="BUTTON"
    ||
    event.target.id==="moon"
    )
    return;


    explode(
    event.clientX,
    event.clientY,
    40
    );


}
);



</script>
