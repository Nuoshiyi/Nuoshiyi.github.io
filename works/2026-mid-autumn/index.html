<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">


<title>
Moonlight Letter · 月满中秋
</title>


<style>


/* ==========================
   基础
========================== */

*{

margin:0;
padding:0;
box-sizing:border-box;

}


html,
body{

width:100%;
height:100%;

overflow:hidden;

font-family:
"PingFang SC",
"Microsoft YaHei",
serif;

background:#050b18;

}



/* ==========================
   夜空背景
========================== */


#scene{

position:fixed;

inset:0;

overflow:hidden;


background:

radial-gradient(
circle at 25% 20%,
rgba(92,115,185,.24),
transparent 34%
),

radial-gradient(
circle at 75% 12%,
rgba(120,140,210,.10),
transparent 22%
),

linear-gradient(
180deg,
#0b1735 0%,
#09142b 48%,
#060b17 100%
);


}



/* ==========================
   星空
========================== */


.star{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

opacity:.7;


animation:

twinkle 3s infinite alternate;

}



@keyframes twinkle{


from{

opacity:.2;

transform:scale(.7);

}


to{

opacity:1;

transform:scale(1.5);

}


}



/* ==========================
   开场遮罩
========================== */


#cover{

position:absolute;

inset:0;

z-index:100;

pointer-events:none;


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


background:

radial-gradient(
circle,
#31436f,
#081022 72%
);


color:#ffe8ae;


transition:

opacity 1.2s ease;

}



.cover-moon{

width:102px;

height:102px;

margin-bottom:25px;

border-radius:50%;

background:
radial-gradient(
 circle at 35% 30%,
 #fffdf3,
 #ffe7a0 55%,
 #ffc968
);

box-shadow:
0 0 22px rgba(255,225,140,.42),
0 0 62px rgba(255,215,100,.12);

position:relative;

animation:
moonBreath 2s infinite alternate;

cursor:pointer;

pointer-events:auto;

}

.cover-moon::before{

content:"";

position:absolute;

inset:0;

width:100%;
height:100%;

border-radius:50%;

background:
radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), transparent 42%),
radial-gradient(circle at 60% 65%, rgba(255,220,150,.08), transparent 48%);

filter: blur(1px);

}



@keyframes moonBreath{


from{

transform:scale(.95);

}


to{

transform:scale(1.08);

}


}



#cover h1{

font-size:25px;

font-weight:normal;

letter-spacing:6px;

}



#cover p{

margin-top:20px;

font-size:13px;

letter-spacing:3px;

color:
rgba(255,255,255,.55);

}



/* ==========================
   月亮
========================== */


.moon{


position:absolute;


left:50%;

top:22%;


width:96px;

height:96px;


transform:

translate(-50%,-50%);


border-radius:50%;


background:

radial-gradient(
circle at 35% 30%,
#fffdf3,
#ffe7a0 55%,
#ffc968
);


box-shadow:


0 0 22px
rgba(255,225,140,.42),


0 0 62px
rgba(255,215,100,.12);


cursor:pointer;


transition:

all 2s ease;


z-index:5;


}



.moon.active{


left:18%;

top:15%;


width:84px;

height:84px;


}




.moon-glow{


position:absolute;


left:50%;

top:22%;


width:280px;

height:280px;


transform:

translate(-50%,-50%);


border-radius:50%;


background:

radial-gradient(
circle,
rgba(255,225,140,.14),
rgba(255,225,140,.04) 42%,
transparent 74%
);


transition:

all 2s ease;


}



.moon-glow.active{


left:18%;

top:15%;


}




/* ==========================
   月面纹理
========================== */
.moon::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.12), transparent 44%);
    filter: blur(1px);
}

.moon::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 65% 70%, rgba(255,220,170,.04), transparent 50%);
}

/* ==========================
   云层
========================== */


.cloud{


position:absolute;


width:220px;

height:55px;


background:

rgba(255,255,255,.07);


border-radius:50px;


filter:blur(7px);


animation:

cloudMove 35s infinite ease-in-out;


}


.cloud:before,
.cloud:after{


content:"";

position:absolute;


background:

rgba(255,255,255,.07);


border-radius:50%;


}



.cloud:before{

width:80px;

height:80px;

left:35px;

top:-35px;

}



.cloud:after{

width:60px;

height:60px;

left:120px;

top:-20px;

}



.cloud1{

top:20%;

left:5%;

}



.cloud2{

top:30%;

left:55%;

animation-duration:45s;

}




@keyframes cloudMove{


50%{

transform:

translateX(80px);

}


}



/* ==========================
   流星
========================== */


.meteor{


position:absolute;


width:120px;

height:2px;


background:

linear-gradient(
90deg,
transparent,
white
);


transform:

rotate(-30deg);


opacity:0;


}



/* ==========================
   烟花 canvas
========================== */


#fireworks{


position:absolute;


inset:0;


z-index:3;


pointer-events:none;

}



/* ==========================
   孔明灯
========================== */


.lantern{


position:absolute;


bottom:-80px;


font-size:35px;


z-index:4;


opacity:.8;


}



/* ==========================
   草坡
========================== */


.grass{


position:absolute;


bottom:-15%;


left:50%;


transform:

translateX(-50%);


width:140%;


height:45%;


border-radius:

50% 50% 0 0;


background:


linear-gradient(
180deg,
#172235,
#050913
);



z-index:2;


}



/* ==========================
   坐在草地上的朋友剪影
========================== */

.people{

    position:absolute;

    left:50%;

    bottom:10%;

    transform:translateX(-50%);

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:8px;

    width:180px;

    z-index:6;

}

.person{

    width:72px;

    height:72px;

    position:relative;

}

.person:first-child{
    transform:translateY(3px);
}

.person:last-child{
    transform:translateY(1px);
}

/* 头 */
.head{

    position:absolute;

    top:4px;

    left:22px;

    width:22px;

    height:22px;

    border-radius:50%;

    background:#05070c;

}

.person:first-child .head{
    left:24px;
}

.person:last-child .head{
    left:20px;
}

/* 身体（坐姿） */
.body{

    position:absolute;

    top:24px;

    left:22px;

    width:24px;

    height:26px;

    border-radius:14px 14px 8px 8px;

    background:#05070c;

    transform-origin:top center;

}

.person:first-child .body{
    transform:rotate(10deg);
}

.person:last-child .body{
    transform:rotate(-10deg);
}

/* 坐着伸出的腿 */
.leg{

    position:absolute;

    bottom:12px;

    width:34px;

    height:7px;

    background:#05070c;

    border-radius:10px;

    transform-origin:left center;

}

.leg.left{

    left:6px;

    transform:rotate(16deg);

}

.leg.right{

    left:28px;

    transform:rotate(-6deg);

}

.person:first-child .leg.left{
    left:10px;
    width:32px;
    transform:rotate(22deg);
}

.person:first-child .leg.right{
    left:30px;
    width:28px;
    transform:rotate(6deg);
}

.person:last-child .leg.left{
    left:6px;
    width:28px;
    transform:rotate(-6deg);
}

.person:last-child .leg.right{
    left:24px;
    width:34px;
    transform:rotate(18deg);
}

.person::before{
    content:"";
    position:absolute;
    width:18px;
    height:5px;
    background:#05070c;
    border-radius:8px;
    top:36px;
}

.person:first-child::before{
    left:10px;
    transform:rotate(24deg);
}

.person:last-child::before{
    right:10px;
    transform:rotate(-24deg);
}

/* ==========================
   草地萤火虫
========================== */
.fireflies{
    position:absolute;
    bottom:20%;
    left:0;
    width:100%;
    height:120px;
    z-index:5;
    pointer-events:none;
}

.fireflies span{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ffeaa0;
    box-shadow:0 0 16px #ffeaa0;
    animation:fireflyFloat 4s infinite ease-in-out;
}

.fireflies span:nth-child(1){left:22%;top:50%;}
.fireflies span:nth-child(2){left:38%;top:25%;animation-delay:1s;}
.fireflies span:nth-child(3){left:58%;top:60%;animation-delay:2s;}
.fireflies span:nth-child(4){left:75%;top:35%;animation-delay:.5s;}
.fireflies span:nth-child(5){left:86%;top:65%;animation-delay:1.5s;}

@keyframes fireflyFloat{
    0%,100%{opacity:.25;transform:translateY(0);}
    50%{opacity:1;transform:translateY(-20px);}
}

/* ==========================
   祝福卡片
========================== */


.message{


position:absolute;


left:50%;


top:50%;


transform:

translate(-50%,-50%);


width:min(88vw,520px);


z-index:10;


text-align:center;


color:#fff4d5;


opacity:0;


transition:

opacity 1.5s ease;


}



.message.show{


opacity:1;


}




.title{


font-size:32px;


letter-spacing:8px;


color:#ffe4a0;


margin-bottom:20px;


}




.blessing-card{


position:relative;


padding:30px;


border-radius:28px;


background:

rgba(255,245,220,.08);


border:

1px solid
rgba(255,220,150,.3);



backdrop-filter:

blur(15px);



box-shadow:


0 0 40px
rgba(255,220,150,.15);


overflow:hidden;


}



.card-light{


position:absolute;


right:-50px;


top:-50px;


width:160px;


height:160px;


background:

radial-gradient(
circle,
rgba(255,230,160,.4),
transparent 70%
);



filter:blur(15px);


}



.style-name{


font-size:13px;


letter-spacing:3px;


color:#ffd98c;


margin-bottom:18px;


}



#blessing{


font-size:18px;


line-height:2;


letter-spacing:2px;


white-space:pre-line;


font-family:

"STKaiti",
"KaiTi",
serif;


}



.buttons{


margin-top:25px;


display:flex;


justify-content:center;


gap:12px;


}



button{


padding:10px 18px;


border-radius:30px;


border:

1px solid
rgba(255,220,150,.3);



background:

rgba(255,255,255,.08);



color:#ffe9b0;


cursor:pointer;


}




.footer{


position:absolute;


bottom:15px;


width:100%;


text-align:center;


font-size:11px;


letter-spacing:4px;


color:

rgba(255,255,255,.3);


}




</style>


</head>
<body>


<div id="scene">


<!-- 开场遮罩 -->

<div id="cover">

    <div class="cover-moon" id="coverMoon">
    </div>

    <h1>
        今晚的月亮还没亮
    </h1>

    <p>
        点击月亮 · 点亮中秋夜
    </p>

</div>



<!-- 月亮 -->

<div class="moon-glow" id="moonGlow"></div>

<div class="moon" id="moon">

</div>




<!-- 云 -->

<div class="cloud cloud1"></div>

<div class="cloud cloud2"></div>



<!-- 烟花 -->

<canvas id="fireworks"></canvas>




<!-- 草坡 -->

<div class="grass"></div>

<!-- 萤火虫 -->
<div class="fireflies">
<span></span><span></span><span></span><span></span><span></span>
</div>




<!-- 人物剪影 -->

<div class="people">


    <!-- 左边人物 -->

    <div class="person">


        <div class="head"></div>

        <div class="body"></div>


        <div class="leg left"></div>

        <div class="leg right"></div>


    </div>



    <!-- 右边人物 -->


    <div class="person">


        <div class="head"></div>

        <div class="body"></div>


        <div class="leg left"></div>

        <div class="leg right"></div>


    </div>



</div>




<!-- 祝福 -->

<div class="message" id="message">


    <div class="title">

        月满 · 中秋

    </div>



    <div class="blessing-card">


        <div class="card-light"></div>



        <div
        class="style-name"
        id="styleName">

        月光寄语

        </div>



        <div id="blessing">

        </div>



    </div>




    <div class="buttons">


        <button onclick="newBlessing()">

            换一句

        </button>


        <button onclick="relightMoon()">

            重新点亮月亮

        </button>


    </div>



</div>






<div class="footer">

    Moonlight Letter · 2026

</div>



</div>





<script>
/* =====================================
   组合式诗意祝福生成器
===================================== */


const blessingPool = {

opening:[
"今夜月明，清风正好。",
"一轮秋月，照过山河。",
"桂影轻摇，晚风微凉。",
"星河安静，月色正温柔。",
"今宵月满，人间清欢。",
"月光落下，夜也柔软起来。",
"清辉入夜，秋意正浓。",
"抬头时，恰逢一轮好月。"
],

scene:[
"愿这一刻，替你收起疲惫。",
"远近山海，共此清辉。",
"愿风有归处，心有安宁。",
"愿平常日子，也有微光可寻。",
"让今夜的月色，替我捎去问候。",
"愿你停一停，也听见自己的心。",
"愿此刻清静，久一点也无妨。",
"愿这一份月光，落在你身旁。"
],

wish:[
"愿所念有回音，所行有暖意。",
"愿心中有光，脚下有路。",
"愿奔赴有意义，等待有归期。",
"愿常有欢喜，也常得自在。",
"愿一路有景，也有人同行。",
"愿忙碌有获，闲时有月。",
"愿日子清亮，心事舒展。",
"愿热爱不减，初心常在。"
],

ending:[
"中秋快乐，岁岁安然。",
"愿月常圆，人常安。",
"愿今夜好梦，明日好景。",
"愿山高水长，仍有清欢。",
"愿此后常有月色，也常有好消息。",
"愿平安喜乐，万事从容。",
"愿来日漫长，皆有值得。",
"愿这一轮月，照亮你的远方。"
]

};


/* 隐藏彩蛋：保持自然，不直接写论文/实验/代码 */
const graduateBlessing = [
"今夜先把未完的事放一放，\n让月光替你守一会儿。\n\n愿探索有答案，\n愿坚持有回响。",

"愿忙碌之外，\n仍留一小块地方给月色。\n\n愿思路渐明，\n前路也渐亮。",

"今夜不问进度，\n只看月圆。\n\n愿每一次认真，\n最终都有温柔的回应。",

"愿长长的日程里，\n也藏着一点清风与月光。\n\n愿所学有所得，\n所盼有回音。"
];


function random(arr){

return arr[
Math.floor(Math.random()*arr.length)
];

}





function generateBlessing(){


/*

8%概率隐藏彩蛋

*/


if(Math.random()<0.08){


return {

style:"月光彩蛋",

text:
random(graduateBlessing)

};


}



return {


style:"月光短笺",


text:

random(blessingPool.opening)

+

"\n"

+

random(blessingPool.scene)

+

"\n\n"

+

random(blessingPool.wish)

+

"\n"

+

random(blessingPool.ending)


};


}






function showBlessing(){


let result=generateBlessing();


document.getElementById(
"styleName"
).innerText=result.style;



document.getElementById(
"blessing"
).innerText=result.text;



}



function newBlessing(){


showBlessing();


smallFirework();


}
/* =====================================
   点击月亮
===================================== */


const moon =
document.getElementById("moon");


const coverMoon =
document.getElementById("coverMoon");


const moonGlow =
document.getElementById("moonGlow");


const cover =
document.getElementById("cover");


const message =
document.getElementById("message");



let started=false;



function startMoon(){


if(started)
return;


started=true;



moon.classList.add("active");


moonGlow.classList.add("active");



cover.style.opacity=0;



setTimeout(()=>{

cover.style.display="none";


},1200);





setTimeout(()=>{


message.classList.add("show");


showBlessing();


startFireworks();


startLantern();


startMeteor();



},1800);



};




// 绑定两个月亮点击事件
moon.onclick = startMoon;
coverMoon.onclick = startMoon;


/* =====================================
   重新点亮
===================================== */


function relightMoon(){


moon.classList.remove("active");

moonGlow.classList.remove("active");


void moon.offsetWidth;


setTimeout(()=>{


moon.classList.add("active");

moonGlow.classList.add("active");


showBlessing();


bigFirework();



},100);


}
/* =====================================
   星空生成
===================================== */

const scene =
document.getElementById("scene");


for(let i=0;i<90;i++){


    const star=
    document.createElement("div");


    star.className="star";


    star.style.left=
    Math.random()*100+"%";


    star.style.top=
    Math.random()*75+"%";


    const size=
    Math.random()*2+1;


    star.style.width=
    size+"px";


    star.style.height=
    size+"px";


    star.style.animationDuration=
    (2+Math.random()*3)+"s";


    star.style.animationDelay=
    Math.random()*2+"s";


    scene.appendChild(star);


}




/* =====================================
   烟花 canvas
===================================== */

const canvas =
document.getElementById("fireworks");


const ctx =
canvas.getContext("2d");


let particles=[];



function resizeCanvas(){


    const ratio=
    window.devicePixelRatio||1;


    canvas.width=
    window.innerWidth*ratio;


    canvas.height=
    window.innerHeight*ratio;


    canvas.style.width=
    window.innerWidth+"px";


    canvas.style.height=
    window.innerHeight+"px";


    ctx.setTransform(
    ratio,0,0,ratio,0,0
    );


}


resizeCanvas();


window.addEventListener(
"resize",
resizeCanvas
);




class Particle{


    constructor(x,y,color){


        this.x=x;
        this.y=y;


        const angle=
        Math.random()*Math.PI*2;


        const speed=
        Math.random()*4+1;


        this.vx=
        Math.cos(angle)*speed;


        this.vy=
        Math.sin(angle)*speed;


        this.alpha=1;


        this.color=color;


        this.size=
        Math.random()*2+1;


    }



    update(){


        this.x+=this.vx;
        this.y+=this.vy;


        this.vy+=0.025;


        this.vx*=0.985;


        this.alpha-=0.012;


    }



    draw(){


        ctx.globalAlpha=
        this.alpha;


        ctx.beginPath();


        ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI*2
        );


        ctx.fillStyle=
        this.color;


        ctx.fill();


    }


}




function explode(x,y,amount=75){


    const colors=[

    "#ffe7a7",
    "#ffd26d",
    "#ffb5ca",
    "#ffffff",
    "#ffc879",
    "#ffd9ef"

    ];


    const color=
    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];


    for(let i=0;i<amount;i++){


        particles.push(
        new Particle(x,y,color)
        );


    }


}




function animate(){


    ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
    );


    particles=
    particles.filter(
    p=>p.alpha>0
    );


    particles.forEach(p=>{


        p.update();
        p.draw();


    });


    ctx.globalAlpha=1;


    requestAnimationFrame(animate);


}


animate();




function bigFirework(){


    explode(
    window.innerWidth*0.22,
    window.innerHeight*0.20,
    80
    );


    setTimeout(()=>{


        explode(
        window.innerWidth*0.68,
        window.innerHeight*0.18,
        80
        );


    },450);



    setTimeout(()=>{


        explode(
        window.innerWidth*0.48,
        window.innerHeight*0.12,
        95
        );


    },900);


}




function smallFirework(){


    explode(
    window.innerWidth*(0.20+Math.random()*0.55),
    window.innerHeight*(0.10+Math.random()*0.26),
    55
    );


}




let fireworkTimer=null;



function startFireworks(){


    bigFirework();


    fireworkTimer=
    setInterval(()=>{


        smallFirework();


        if(Math.random()<0.45){

            setTimeout(
            smallFirework,
            350
            );

        }


    },3200);


}




/* =====================================
   孔明灯
===================================== */

function createLantern(){


    const lantern=
    document.createElement("div");


    lantern.className="lantern";


    lantern.innerText="🏮";


    lantern.style.left=
    (10+Math.random()*80)+"%";


    lantern.style.animation=
    `lanternRise ${12+Math.random()*6}s linear forwards`;


    lantern.style.fontSize=
    (24+Math.random()*18)+"px";


    scene.appendChild(lantern);


    setTimeout(()=>{

        lantern.remove();

    },19000);


}




function startLantern(){


    const style=
    document.createElement("style");


    style.innerHTML=`

    @keyframes lanternRise{

        0%{
            transform:translateY(0);
            opacity:0;
        }

        10%{
            opacity:.85;
        }

        100%{
            transform:translateY(-120vh) translateX(20px);
            opacity:0;
        }

    }

    `;


    document.head.appendChild(style);


    createLantern();


    setInterval(()=>{

        createLantern();

    },2600);


}




/* =====================================
   流星
===================================== */

function createMeteor(){


    const meteor=
    document.createElement("div");


    meteor.className="meteor";


    meteor.style.left=
    (58+Math.random()*28)+"%";


    meteor.style.top=
    (8+Math.random()*18)+"%";


    meteor.style.opacity=1;


    scene.appendChild(meteor);


    meteor.animate([

        {
            transform:"translate(0,0) rotate(-30deg)",
            opacity:0
        },

        {
            transform:"translate(0,0) rotate(-30deg)",
            opacity:1,
            offset:0.15
        },

        {
            transform:"translate(-180px,110px) rotate(-30deg)",
            opacity:0
        }

    ],{
        duration:1300,
        easing:"ease-out"
    });


    setTimeout(()=>{

        meteor.remove();

    },1400);


}




function startMeteor(){


    setInterval(()=>{


        if(Math.random()<0.65){

            createMeteor();

        }


    },4800);


}

===================================== */

document.addEventListener(
"click",
function(event){


    if(!started)
    return;


    if(
    event.target.tagName==="BUTTON"
    ||
    event.target.id==="moon"
    )
    return;


    explode(
    event.clientX,
    event.clientY,
    40
    );


}
);
